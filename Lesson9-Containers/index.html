<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Containers and Identity</title>
    <style>
        .highlight {
            background-color: tomato;
        }
        #site-footer {
            color: lightgoldenrodyellow;
            background-color: tomato;
        }
        .card {
            color: tomato;
            background-color: lightgoldenrodyellow;
            border: 2px solid tomato;
            border-radius: 10px;
        }
        #main-nav {
            background: lightgoldenrodyellow;
            color: tomato;
        }
        .span {
            color: tomato;
            font-weight: 700;
            font-size: large;
        }
    </style>
</head>
<body>
    <nav id="main-nav">...nav links...</nav>
    <p class="highlight">First Note</p>
    <p class="highlight">Second Note</p>
    <p class="highlight">Third Note</p>
    <p>A plain note - no class, no color</p>
    <div class="card">
        <h2>Product A</h2>
        <p>First product</p>
    </div>
    <div class="card">
        <h2>Product B</h2>
        <p>Second product</p>
    </div>
    <p>The price is <span class="span">$29</span> today only!</p>
    <footer id="site-footer">
        @ 2026 club signup
    </footer>
</body>
</html>
